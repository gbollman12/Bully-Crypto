<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bully Crypto</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.PNG">

<style>
body {
  margin:0;
  background:#050606;
  color:#fff;
  font-family:-apple-system;
}

/* HEADER */
.header {
  display:flex;
  align-items:center;
  gap:12px;
  padding:18px;
  border-bottom:1px solid #1f1f1f;
}
.logo {
  width:42px;
  height:42px;
  border-radius:10px;
}
.title {
  font-weight:800;
}
.sub {
  font-size:12px;
  color:#888;
}

/* INPUT */
input {
  width:100%;
  padding:14px;
  border:none;
  border-bottom:1px solid #1f1f1f;
  background:#050606;
  color:white;
}

/* COINS */
.quick {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:12px;
}
.quick button {
  flex:1 1 28%;
  padding:10px;
  border-radius:8px;
  border:1px solid #222;
  background:#101010;
  color:white;
  font-weight:700;
}

/* TABS */
.tabs {
  display:flex;
  border-bottom:1px solid #1f1f1f;
}
.tab {
  flex:1;
  text-align:center;
  padding:12px;
  color:#777;
}
.tab.active {
  color:#7cff55;
  border-bottom:2px solid #7cff55;
}

/* SCREENS */
.screen { display:none; padding:16px; }
.screen.active { display:block; }

/* CARDS */
.card {
  background:#101010;
  border:1px solid #1f1f1f;
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
}
.big {
  font-size:34px;
  font-weight:800;
}
.small { color:#999; }

/* SIGNAL */
.decision {
  font-size:42px;
  font-weight:900;
}
.buy { color:#7cff55; }
.sell { color:#ff4d5d; }
.hold { color:#ffd60a; }

.bar {
  height:6px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
}
.fill {
  height:100%;
  background
