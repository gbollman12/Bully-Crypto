<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bully Crypto</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#050606;color:white;font-family:-apple-system,Arial}
.app{max-width:520px;margin:auto;padding-bottom:90px}

/* HEADER */
.top{display:flex;justify-content:space-between;padding:16px}
.title{font-size:20px;font-weight:900}
.mode{font-size:10px;border:1px solid #333;padding:5px 8px;border-radius:999px;color:#aaa}

/* TICKER */
.tickerWrap{overflow:hidden;border-top:1px solid #111;border-bottom:1px solid #111}
.ticker{display:flex;gap:26px;padding:10px 0;white-space:nowrap;animation:scroll 18s linear infinite;font-size:13px;font-weight:900}
.tUp{color:#7cff55}.tDown{color:#ff4d5d}.tFlat{color:#aaa}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* COINS */
.coinRail{display:flex;gap:8px;padding:12px;overflow-x:auto}
.coinRail button{padding:10px 14px;border-radius:999px;background:#0b0e0c;border:1px solid #222;color:#ddd;font-weight:900}
.coinRail button.active{background:#7cff55;color:#000}

/* MAIN PANEL */
.main{margin:12px;padding:18px;border-radius:26px;background:#0d120e;border:1px solid #243028}
.signal{font-size:36px;font-weight:900}
.price{font-size:40px;font-weight:900;margin-top:6px}
.move{font-size:14px;margin-top:4px;color:#aaa}

/* CHART */
canvas{width:100%;height:90px;margin-top:12px}

/* METRICS */
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px}
.metric{background:#0b0e0c;border:1px solid #222;border-radius:16px;padding:12px}
.metric div:first-child{font-size:10px;color:#777}
.metric div:last-child{font-size:16px;font-weight:900}

/* INSIGHT */
.insight{margin:12px;padding:14px;border-radius:20px;background:#0f1511;border:1px solid #263029}
.insightHeader{font-size:10px;color:#7cff55;font-weight:900;margin-bottom:6px}
.insightText{font-size:14px}

/* MARKET PULSE */
.pulse{margin:12px;padding:14px;border-radius:20px;background:#0b0e0c;border:1px solid #222}
.pulseRow{display:flex;justify-content:space-between;padding:6px 0;color:#aaa}
.pulseRow span:last-child{color:#fff;font-weight:900}

/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;display:flex;padding:10px;background:#050606}
.nav button{flex:1;padding:12px;border:1px solid #222;background:#0b0e0c;color:#777;border-radius:14px}
.nav button.active{background:#7cff55;color:#000}
</style>
</head>

<body>
<div class="app">

<div class="top">
  <div class="title">BULLY CRYPTO</div>
  <div class="mode">ANALYSIS</div>
</div>

<div class="tickerWrap">
  <div id="ticker" class="ticker"></div>
</div>

<div class="coinRail">
  <button onclick="pick('BTC',65000,this)">BTC</button>
  <button onclick="pick('ETH',3000,this)">ETH</button>
  <button onclick="pick('SOL',150,this)">SOL</button>
  <button onclick="pick('XRP',0.6,this)">XRP</button>
</div>

<div class="main">
  <div id="signal" class="signal">WAIT</div>
  <div id="price" class="price">—</div>
  <div id="move" class="move">Tap coin</div>
  <canvas id="chart"></canvas>
</div>

<div class="grid">
  <div class="metric"><div>Trend</div><div id="trend">—</div></div>
  <div class="metric"><div>Confidence</div><div id="confidence">—</div></div>
  <div class="metric"><div>Setup</div><div id="setup">—</div></div>
</div>

<div class="insight">
  <div class="insightHeader">Market Insight</div>
  <div id="reason" class="insightText">Waiting...</div>
</div>

<div class="pulse">
  <div class="pulseRow"><span>Market Bias</span><span id="bias">—</span></div>
  <div class="pulseRow"><span>Volatility</span><span id="vol">—</span></div>
  <div class="pulseRow"><span>Pressure</span><span id="pressure">—</span></div>
</div>

<div class="nav">
  <button class="active">Overview</button>
  <button>Plan</button>
  <button>Position</button>
</div>

</div>

<script>
let price=0, selectedCoin="", timer=null;
let priceHistory=[], marketData={BTC:65000,ETH:3000,SOL:150,XRP:0.6};
let marketHistory={};

function pick(sym,start,btn){
  selectedCoin=sym;
  document.querySelectorAll(".coinRail button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  price=start;
  priceHistory=[start];

  if(timer) clearInterval(timer);
  run();
  timer=setInterval(run,3000);
}

function run(){
  price += price*(Math.random()-.5)*0.002;
  priceHistory.push(price);
  if(priceHistory.length>30) priceHistory.shift();

  drawChart();
  updateMarket();
  updateTicker();

  let trendMove=((priceHistory.at(-1)-priceHistory[0])/priceHistory[0])*100;

  let decision="HOLD";
  if(trendMove>0.2) decision="BUY";
  else if(trendMove<-0.2) decision="SELL";

  document.getElementById("signal").innerText=decision;
  document.getElementById("price").innerText="$"+price.toFixed(2);
  document.getElementById("move").innerText=trendMove.toFixed(2)+"%";

  document.getElementById("trend").innerText=trendMove>0?"BULL":"BEAR";
  document.getElementById("confidence").innerText=Math.abs(trendMove*3).toFixed(0)+"/100";
  document.getElementById("setup").innerText=decision;

  document.getElementById("reason").innerText=
    decision==="BUY"?"Momentum building. Watch pullbacks.":
    decision==="SELL"?"Weakness confirmed. Stay defensive.":
    "No edge. Wait for clarity.";

  updatePulse();
}

function drawChart(){
  const c=document.getElementById("chart");
  const ctx=c.getContext("2d");
  c.width=c.offsetWidth;
  c.height=90;

  let min=Math.min(...priceHistory);
  let max=Math.max(...priceHistory);

  ctx.clearRect(0,0,c.width,c.height);
  ctx.beginPath();

  priceHistory.forEach((p,i)=>{
    let x=i/(priceHistory.length-1)*c.width;
    let y=c.height-((p-min)/(max-min||1))*c.height;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });

  ctx.strokeStyle="#7cff55";
  ctx.lineWidth=2;
  ctx.stroke();
}

function updateMarket(){
  Object.keys(marketData).forEach(c=>{
    let val=marketData[c];
    val+=val*(Math.random()-.5)*0.003;
    marketData[c]=val;

    if(!marketHistory[c]) marketHistory[c]=[val];
    marketHistory[c].push(val);
    if(marketHistory[c].length>20) marketHistory[c].shift();
  });
}

function updateTicker(){
  let html="";
  Object.keys(marketData).forEach(c=>{
    let h=marketHistory[c];
    if(!h) return;
    let change=((h.at(-1)-h[0])/h[0])*100;
    let cls=change>0?"tUp":change<0?"tDown":"tFlat";
    html+=`<div class="${cls}">${c} ${change.toFixed(2)}%</div>`;
  });
  document.getElementById("ticker").innerHTML=html+html;
}

function updatePulse(){
  let changes=Object.values(marketHistory).map(h=>((h.at(-1)-h[0])/h[0])*100);
  let avg=changes.reduce((a,b)=>a+b,0)/changes.length;

  document.getElementById("bias").innerText=avg>0?"BULLISH":"BEARISH";
  document.getElementById("vol").innerText=(Math.max(...changes)-Math.min(...changes)).toFixed(2)+"%";
  document.getElementById("pressure").innerText=avg.toFixed(2)+"%";
}
</script>

</body>
</html>
