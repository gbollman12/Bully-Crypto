<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foreman OS</title>

<style>
body {
  margin:0;
  background:#050606;
  color:white;
  font-family:-apple-system,Arial;
}
.app {
  max-width:500px;
  margin:auto;
  padding:12px;
  padding-bottom:90px;
}
.card {
  background:#111;
  border-radius:16px;
  padding:12px;
  margin-bottom:10px;
}
input, textarea {
  width:100%;
  background:#000;
  border:1px solid #222;
  color:white;
  border-radius:10px;
  padding:10px;
  margin-top:6px;
}
button {
  background:white;
  color:black;
  border:none;
  padding:10px;
  border-radius:10px;
  font-weight:bold;
}
.row {
  display:flex;
  gap:6px;
}
.small {
  font-size:12px;
  color:#aaa;
}
.task {
  display:flex;
  gap:8px;
  background:#000;
  padding:8px;
  border-radius:10px;
  margin-bottom:6px;
}
.done {
  text-decoration:line-through;
  color:#555;
}
.nav {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:black;
  display:flex;
}
.nav button {
  flex:1;
  border-radius:0;
  background:black;
  color:#aaa;
}
.nav .active {
  color:white;
}
</style>
</head>

<body>

<div class="app">

<h2>Foreman OS</h2>

<div class="card">
<input id="job" value="Monday Plan">
<input id="stage" value="Framing / Roof">
</div>

<div class="card">
<div class="small">Mode</div>
<div id="mode" style="font-size:22px;font-weight:bold;">ATTACK</div>
</div>

<div id="planTab">

<div class="card">
<h3>Tasks</h3>
<div id="tasks"></div>

<div class="row">
<input id="newTask" placeholder="Add task">
<button onclick="addTask()">+</button>
</div>
</div>

<div class="card">
<h3>Blockers</h3>
<textarea id="blockers"></textarea>
</div>

</div>

<div id="crewTab" style="display:none">

<div class="card">
<h3>Crew</h3>
<div id="crew"></div>
<button onclick="addCrew()">Add Guy</button>
</div>

</div>

<div id="sendTab" style="display:none">

<div class="card">
<h3>Text Plan</h3>
<textarea id="output"></textarea>
<button onclick="copy()">Copy</button>
</div>

</div>

</div>

<div class="nav">
<button onclick="tab('plan')" id="planBtn" class="active">Plan</button>
<button onclick="tab('crew')" id="crewBtn">Crew</button>
<button onclick="tab('send')" id="sendBtn">Send</button>
</div>

<script>

let tasks = [
  {text:"Walk job", done:false},
  {text:"Check material", done:false}
];

let crew = [
  {name:"Guy 1", task:"Layout"},
  {name:"Guy 2", task:"Cut"}
];

function render() {
  let t = document.getElementById("tasks");
  t.innerHTML = "";
  tasks.forEach((task,i)=>{
    t.innerHTML += `
    <div class="task">
      <input type="checkbox" onchange="toggle(${i})">
      <div class="${task.done?'done':''}">${task.text}</div>
    </div>`;
  });

  let c = document.getElementById("crew");
  c.innerHTML="";
  crew.forEach((g,i)=>{
    c.innerHTML += `
    <div class="task">
      <input value="${g.name}" onchange="crew[${i}].name=this.value">
      <input value="${g.task}" onchange="crew[${i}].task=this.value">
    </div>`;
  });

  let mode = "ATTACK";
  let open = tasks.filter(t=>!t.done).length;
  if(open<2) mode="CLEANUP";
  else if(open<4) mode="CONTROL";

  document.getElementById("mode").innerText = mode;

  document.getElementById("output").value =
`FOREMAN PLAN

Job: ${document.getElementById("job").value}
Stage: ${document.getElementById("stage").value}
Mode: ${mode}

TASKS:
${tasks.map((t,i)=>`${i+1}. ${t.text}`).join("\n")}

CREW:
${crew.map(c=>`${c.name}: ${c.task}`).join("\n")}

BLOCKERS:
${document.getElementById("blockers").value}`;
}

function addTask(){
  let v=document.getElementById("newTask").value;
  if(!v) return;
  tasks.push({text:v,done:false});
  document.getElementById("newTask").value="";
  render();
}

function toggle(i){
  tasks[i].done=!tasks[i].done;
  render();
}

function addCrew(){
  crew.push({name:"Guy",task:"Task"});
  render();
}

function tab(name){
  document.getElementById("planTab").style.display="none";
  document.getElementById("crewTab").style.display="none";
  document.getElementById("sendTab").style.display="none";

  document.getElementById(name+"Tab").style.display="block";

  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  document.getElementById(name+"Btn").classList.add("active");
}

function copy(){
  navigator.clipboard.writeText(document.getElementById("output").value);
}

render();

</script>

</body>
</html>
