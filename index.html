<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bully Crypto</title>

<link rel="apple-touch-icon" href="logo.PNG">
<link rel="icon" href="logo.PNG">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
body{margin:0;background:#050606;color:white;font-family:-apple-system,BlinkMacSystemFont,Arial}
.app{max-width:520px;margin:auto;padding-bottom:30px}
.header{display:flex;align-items:center;gap:14px;padding:18px;border-bottom:1px solid #1f1f1f}
.logo{width:54px;height:54px;border-radius:12px}
.title{font-size:24px;font-weight:900}
.sub{font-size:12px;color:#7cff55}

input{width:100%;padding:14px;border:none;border-bottom:1px solid #1f1f1f;background:#050606;color:white;font-size:16px}

.quick{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.quick button{flex:1 1 28%;padding:11px;border-radius:10px;border:1px solid #2a2a2a;background:#101010;color:white;font-weight:800}

.tabs{display:flex;border-top:1px solid #1f1f1f;border-bottom:1px solid #1f1f1f}
.tab{flex:1;text-align:center;padding:12px;color:#777;font-weight:800}
.tab.active{color:#7cff55;border-bottom:2px solid #7cff55}

.screen{display:none}
.screen.active{display:block}

.card{background:#101010;border:1px solid #242a25;border-radius:18px;padding:16px;margin:14px}
.price{font-size:44px;font-weight:950}
.badge{padding:12px 18px;border-radius:999px;font-size:18px;font-weight:950;border:1px solid}
.buy{color:#7cff55;border-color:#7cff55}
.sell{color:#ff4d5d;border-color:#ff4d5d}
.hold{color:#ffd60a;border-color:#ffd60a}

.row{display:flex;justify-content:space-between;margin-top:10px}
.small{color:#aaa}
</style>
</head>

<body>
<div class="app">

<div class="header">
<img src="logo.PNG" class="logo">
<div>
<div class="title">BULLY</div>
<div class="sub">CRYPTO</div>
</div>
</div>

<input id="ticker" placeholder="BTC, ETH, SOL">

<div class="quick">
<button onclick="pick('BTC')">BTC</button>
<button onclick="pick('ETH')">ETH</button>
<button onclick="pick('SOL')">SOL</button>
<button onclick="pick('XRP')">XRP</button>
<button onclick="pick('DOGE')">DOGE</button>
<button onclick="pick('ADA')">ADA</button>
</div>

<div class="tabs">
<div class="tab active" onclick="tab(0)">Overview</div>
<div class="tab" onclick="tab(1)">Plan</div>
<div class="tab" onclick="tab(2)">Funds</div>
</div>

<div class="screen active">
<div class="card">
<div id="coin" class="small">SELECT COIN</div>
<div id="price" class="price">—</div>
<div id="move" class="small">Tap a coin</div>
<br>
<div id="signal" class="badge hold">WAIT</div>
</div>

<div class="card">
<div class="row"><span>Trend</span><span id="trend">—</span></div>
<div class="row"><span>Setup</span><span id="setup">—</span></div>
<div class="row"><span>RSI</span><span id="rsiOut">—</span></div>
<div class="row"><span>Confidence</span><span id="confidence">—</span></div>
</div>

<div class="card">
<div id="reason" class="small">Waiting.</div>
</div>
</div>

<div class="screen">
<div class="card">
<div class="row"><span>Entry</span><span id="entry">—</span></div>
<div class="row"><span>Stop</span><span id="stop">—</span></div>
<div class="row"><span>Target</span><span id="target">—</span></div>
<div class="row"><span>R/R</span><span id="rr">—</span></div>
</div>

<div class="card">
<div class="row"><span>Position $</span><span id="position">—</span></div>
<div class="row"><span>Coins</span><span id="coins">—</span></div>
</div>
</div>

<div class="screen">
<div class="card">
<input id="funds" placeholder="Account funds">
<input id="risk" placeholder="Risk %">
<button onclick="saveFunds()">Save</button>
</div>
</div>

</div>

<script>
const PAIRS={BTC:"BTCUSDT",ETH:"ETHUSDT",SOL:"SOLUSDT",XRP:"XRPUSDT",DOGE:"DOGEUSDT",ADA:"ADAUSDT"};

let liveTimer=null;
let lastPlan=null;

function tab(i){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
document.querySelectorAll(".screen")[i].classList.add("active");
document.querySelectorAll(".tab")[i].classList.add("active");
}

function money(n){return "$"+Number(n).toFixed(2)}

function setSignal(d){
let el=document.getElementById("signal");
el.textContent=d;
el.className="badge "+(d==="BUY"?"buy":d==="SELL"?"sell":"hold");
}

function pick(sym){
document.getElementById("ticker").value=sym;
if(liveTimer)clearInterval(liveTimer);
run();
liveTimer=setInterval(()=>run(true),2500);
}

function ema(v,p){let k=2/(p+1),e=v[0];for(let i=1;i<v.length;i++)e=v[i]*k+e*(1-k);return e}
function rsi(v,p=14){
let g=0,l=0;
for(let i=v.length-p;i<v.length;i++){let d=v[i]-v[i-1];if(d>=0)g+=d;else l-=d}
if(l===0)return 100;let rs=g/l;return 100-(100/(1+rs))
}

async function run(live=false){
let sym=document.getElementById("ticker").value.toUpperCase();
if(!PAIRS[sym])return;

if(!live){
document.getElementById("coin").textContent=sym;
document.getElementById("price").textContent="Loading...";
}

try{
let [t,k]=await Promise.all([
fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${PAIRS[sym]}`).then(r=>r.json()),
fetch(`https://api.binance.com/api/v3/klines?symbol=${PAIRS[sym]}&interval=15m&limit=50`).then(r=>r.json())
]);

let price=+t.lastPrice;
let move=+t.priceChangePercent;
let closes=k.map(x=>+x[4]);

let fast=ema(closes,12);
let slow=ema(closes,26);
let r=rsi(closes);

let score=50;
if(price>fast)score+=10;else score-=10;
if(fast>slow)score+=15;else score-=15;
if(move>2)score+=10;
if(move<-2)score-=10;
if(r>45&&r<70)score+=5;
if(r>75)score-=5;

score=Math.max(0,Math.min(100,score));

let decision="HOLD";
if(score>=70)decision="BUY";
if(score<=35)decision="SELL";

document.getElementById("price").textContent=money(price);
document.getElementById("move").textContent=move.toFixed(2)+"%";
setSignal(decision);

document.getElementById("trend").textContent=score>70?"BULL":score<35?"BEAR":"MIXED";
document.getElementById("setup").textContent=decision==="BUY"?"MOMENTUM":decision==="SELL"?"WEAK":"WAIT";
document.getElementById("rsiOut").textContent=Math.round(r);
document.getElementById("confidence").textContent=score+"/100";

document.getElementById("reason").textContent=decision==="BUY"?"Momentum + trend aligned":decision==="SELL"?"Downtrend + weakness":"No edge";

let entryLow=price*.99;
let entryHigh=price*1.01;
let stop=price*.96;
let target=price*1.06;

let mid=(entryLow+entryHigh)/2;
let risk=Math.abs(mid-stop);
let reward=Math.abs(target-mid);
let rr=reward/risk;

document.getElementById("entry").textContent=money(entryLow)+"-"+money(entryHigh);
document.getElementById("stop").textContent=money(stop);
document.getElementById("target").textContent=money(target);
document.getElementById("rr").textContent="1:"+rr.toFixed(2);

lastPlan={mid,stop};

updateSizing();

}catch(e){
setSignal("WAIT");
document.getElementById("reason").textContent="Connection issue";
}
}

function saveFunds(){
localStorage.setItem("f",document.getElementById("funds").value);
localStorage.setItem("r",document.getElementById("risk").value);
updateSizing();
}

function updateSizing(){
let f=+localStorage.getItem("f")||500;
let r=+localStorage.getItem("r")||1;

let maxRisk=f*(r/100);

if(!lastPlan)return;

let riskPerCoin=Math.abs(lastPlan.mid-lastPlan.stop);
let coins=maxRisk/riskPerCoin;

document.getElementById("position").textContent=money(coins*lastPlan.mid);
document.getElementById("coins").textContent=coins.toFixed(4);
}
</script>

</body>
</html>
