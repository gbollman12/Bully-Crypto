<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bully Crypto</title>

<style>
body {
  margin:0;
  background:#050606;
  color:#fff;
  font-family:-apple-system;
}

.header {
  display:flex;
  align-items:center;
  gap:12px;
  padding:18px;
  border-bottom:1px solid #1f1f1f;
}

.logo {
  width:44px;
  height:44px;
  border-radius:12px;
}

.title { font-weight:800; }
.sub { font-size:12px; color:#888; }

input {
  width:100%;
  padding:14px;
  border:none;
  border-bottom:1px solid #1f1f1f;
  background:#050606;
  color:white;
}

.quick {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:12px;
}

.quick button {
  flex:1 1 28%;
  padding:10px;
  border-radius:8px;
  border:1px solid #222;
  background:#101010;
  color:white;
  font-weight:700;
}

.tabs {
  display:flex;
  border-bottom:1px solid #1f1f1f;
}

.tab {
  flex:1;
  text-align:center;
  padding:12px;
  color:#777;
}

.tab.active {
  color:#7cff55;
  border-bottom:2px solid #7cff55;
}

.screen { display:none; padding:16px; }
.screen.active { display:block; }

.card {
  background:#101010;
  border:1px solid #1f1f1f;
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
}

.signalBox {
  border-radius:18px;
  padding:22px 16px;
  margin-bottom:14px;
  border:2px solid #333;
}

.signalText {
  font-size:54px;
  font-weight:950;
  letter-spacing:-1px;
}

.signalReason {
  font-size:15px;
  color:#ccc;
  margin-top:6px;
}

.buyBox {
  border-color:#7cff55;
  background:rgba(124,255,85,.08);
}

.sellBox {
  border-color:#ff4d5d;
  background:rgba(255,77,93,.08);
}

.holdBox {
  border-color:#ffd60a;
  background:rgba(255,214,10,.08);
}

.buy { color:#7cff55; }
.sell { color:#ff4d5d; }
.hold { color:#ffd60a; }

.big {
  font-size:34px;
  font-weight:800;
}

.small { color:#999; }

.row {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.label {
  font-size:11px;
  color:#777;
  font-weight:800;
  letter-spacing:.5px;
  text-transform:uppercase;
}

.value {
  font-size:22px;
  font-weight:800;
  margin-top:4px;
}

.bar {
  height:8px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
  margin-top:8px;
}

.fill {
  height:100%;
  background:#7cff55;
}

iframe { border-radius:12px; }
</style>
</head>

<body>

<div class="header">
  <img src="logo.PNG" class="logo">
  <div>
    <div class="title">BULLY</div>
    <div class="sub">CRYPTO</div>
  </div>
</div>

<input id="ticker" placeholder="BTC, ETH, SOL">

<div class="quick">
  <button onclick="selectCoin('BTC')">BTC</button>
  <button onclick="selectCoin('ETH')">ETH</button>
  <button onclick="selectCoin('SOL')">SOL</button>
  <button onclick="selectCoin('XRP')">XRP</button>
  <button onclick="selectCoin('ZEC')">ZEC</button>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab(0)">Overview</div>
  <div class="tab" onclick="switchTab(1); loadChart()">Chart</div>
  <div class="tab" onclick="switchTab(2)">Decision</div>
</div>

<div class="screen active">

  <div id="signalBox" class="signalBox holdBox">
    <div id="decisionTop" class="signalText hold">WAIT</div>
    <div id="reasonTop" class="signalReason">Select a coin</div>
  </div>

  <div class="card">
    <div class="label">Price</div>
    <div class="big" id="price">—</div>
    <div class="small" id="move">—</div>
  </div>

  <div class="row">
    <div class="card">
      <div class="label">Trend</div>
      <div class="value" id="trend">—</div>
    </div>

    <div class="card">
      <div class="label">Setup</div>
      <div class="value" id="setup">—</div>
    </div>
  </div>

  <div class="card">
    <div class="label">Setup Strength</div>
    <div class="bar"><div id="strengthBar" class="fill"></div></div>
    <div class="small" id="strengthText">—</div>
  </div>
</div>

<div class="screen">
  <div id="chart"></div>
</div>

<div class="screen">
  <div class="card">
    <div id="decision" class="signalText hold">WAIT</div>
    <div class="small" id="reason"></div>
  </div>

  <div class="card">
    <div class="label">Rule</div>
    <div class="small" id="ruleText">
      BUY = strong upside momentum. SELL = heavy downside pressure. HOLD = no clean setup.
    </div>
  </div>
</div>

<script>
let currentSymbol = "";
let chartLoaded = "";

const screens = document.querySelectorAll(".screen");
const tabs = document.querySelectorAll(".tab");

const priceEl = document.getElementById("price");
const moveEl = document.getElementById("move");
const trendEl = document.getElementById("trend");
const setupEl = document.getElementById("setup");

const decisionTop = document.getElementById("decisionTop");
const reasonTop = document.getElementById("reasonTop");
const signalBox = document.getElementById("signalBox");

const decisionEl = document.getElementById("decision");
const reasonEl = document.getElementById("reason");

const strengthBar = document.getElementById("strengthBar");
const strengthText = document.getElementById("strengthText");

const chart = document.getElementById("chart");
const ticker = document.getElementById("ticker");

function switchTab(i){
  screens.forEach(s => s.classList.remove("active"));
  tabs.forEach(t => t.classList.remove("active"));
  screens[i].classList.add("active");
  tabs[i].classList.add("active");
}

function selectCoin(sym){
  ticker.value = sym;
  currentSymbol = "";
  run();
}

let timeout;
ticker.addEventListener("input", () => {
  clearTimeout(timeout);
  timeout = setTimeout(run, 300);
});

const idMap = {
  BTC:"bitcoin",
  ETH:"ethereum",
  SOL:"solana",
  XRP:"ripple",
  ZEC:"zcash"
};

async function run(){
  const sym = ticker.value.toUpperCase();
  if(!sym || sym === currentSymbol) return;
  currentSymbol = sym;
  chartLoaded = "";

  const id = idMap[sym];
  if(!id) return;

  priceEl.textContent = "Loading...";
  moveEl.textContent = "";

  const data = await fetch(
    `https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=usd&include_24hr_change=true`
  ).then(r=>r.json());

  const price = data[id].usd;
  const move = data[id].usd_24h_change;

  priceEl.textContent = "$" + price.toFixed(2);
  moveEl.textContent = move.toFixed(2) + "% over 24h";

  let trend = "CHOP";
  let setup = "WAIT";
  let decision = "HOLD";
  let reason = "No clean setup yet.";
  let strength = 40;

  if(move >= 5){
    trend = "HOT";
    setup = "BREAKOUT";
    decision = "BUY";
    reason = "Strong momentum. Wait for a clean pullback if it feels extended.";
    strength = 90;
  }
  else if(move >= 2){
    trend = "BULL";
    setup = "WATCH";
    decision = "BUY";
    reason = "Momentum is building. Good candidate, but don’t chase a vertical candle.";
    strength = 75;
  }
  else if(move >= 0.75){
    trend = "UP";
    setup = "BUILDING";
    decision = "HOLD";
    reason = "Strength is forming, but entry is not clean yet.";
    strength = 58;
  }
  else if(move <= -5){
    trend = "DUMP";
    setup = "BREAKDOWN";
    decision = "SELL";
    reason = "Heavy downside pressure. Avoid new longs.";
    strength = 90;
  }
  else if(move <= -2){
    trend = "BEAR";
    setup = "WEAK";
    decision = "SELL";
    reason = "Momentum is down. Wait for stabilization before buying.";
    strength = 75;
  }
  else if(move <= -0.75){
    trend = "DOWN";
    setup = "CAUTION";
    decision = "HOLD";
    reason = "Weakening, but not enough for a clean sell signal.";
    strength = 50;
  }

  updateSignal(decision, reason);

  trendEl.textContent = trend;
  setupEl.textContent = setup;

  strengthBar.style.width = strength + "%";
  strengthText.textContent = strength + "/100";

  decisionEl.textContent = decision;
  reasonEl.textContent = reason;
}

function updateSignal(decision, reason){
  decisionTop.textContent = decision;
  reasonTop.textContent = reason;

  decisionTop.className = "signalText " +
    (decision === "BUY" ? "buy" : decision === "SELL" ? "sell" : "hold");

  decisionEl.className = "signalText " +
    (decision === "BUY" ? "buy" : decision === "SELL" ? "sell" : "hold");

  signalBox.className = "signalBox " +
    (decision === "BUY" ? "buyBox" : decision === "SELL" ? "sellBox" : "holdBox");
}

function loadChart(){
  if(!currentSymbol) return;
  if(chartLoaded === currentSymbol) return;
  chartLoaded = currentSymbol;

  chart.innerHTML = `
    <iframe width="100%" height="400"
      src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:${currentSymbol}USDT&theme=dark"
      frameborder="0">
    </iframe>`;
}
</script>

</body>
</html>
