<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bully Crypto</title>
<link rel="apple-touch-icon" href="logo.PNG">

<style>
body{margin:0;background:#050606;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial}
.app{max-width:520px;margin:auto;padding-bottom:30px}

.header{display:flex;align-items:center;gap:14px;padding:18px;border-bottom:1px solid #1f1f1f}
.logo{width:52px;height:52px;border-radius:12px}
.title{font-size:22px;font-weight:900}
.sub{font-size:12px;color:#888}

input{width:100%;padding:14px;border:none;border-bottom:1px solid #1f1f1f;background:#050606;color:white}

.quick{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.quick button{flex:1 1 28%;padding:10px;border-radius:10px;border:1px solid #2a2a2a;background:#101010;color:white;font-weight:800}

.hero,.card{
  background:linear-gradient(180deg,#121412,#080908);
  border:1px solid #242a25;
  border-radius:18px;
  padding:16px;
  margin:12px;
}

.price{font-size:44px;font-weight:950}
.move{font-size:16px}

.badge{
  padding:10px 16px;
  border-radius:999px;
  font-weight:900;
}

.buy{color:#7cff55;border:1px solid #7cff55}
.sell{color:#ff4d5d;border:1px solid #ff4d5d}
.hold{color:#ffd60a;border:1px solid #ffd60a}

.bar{height:8px;background:#252525;border-radius:20px;margin-top:10px}
.fill{height:100%;background:#7cff55}

.small{color:#aaa;margin-top:6px}
</style>
</head>

<body>

<div class="app">

<div class="header">
  <img src="logo.PNG" class="logo">
  <div>
    <div class="title">BULLY</div>
    <div class="sub">CRYPTO</div>
  </div>
</div>

<input id="ticker" placeholder="BTC, ETH, SOL">

<div class="quick">
  <button onclick="pick('BTC')">BTC</button>
  <button onclick="pick('ETH')">ETH</button>
  <button onclick="pick('SOL')">SOL</button>
  <button onclick="pick('XRP')">XRP</button>
  <button onclick="pick('ZEC')">ZEC</button>
</div>

<div class="hero">
  <div id="price">—</div>
  <div id="move">—</div>
  <div id="signal" class="badge hold">WAIT</div>
</div>

<div class="card">
  <div>Trend: <span id="trend">—</span></div>
  <div>Setup: <span id="setup">—</span></div>
  <div class="bar"><div id="strength" class="fill"></div></div>
  <div class="small" id="reason">Waiting for coin</div>
</div>

<div class="card">
  <div>Entry: <span id="entry">—</span></div>
  <div>Stop: <span id="stop">—</span></div>
  <div>Target: <span id="target">—</span></div>
</div>

</div>

<script>
const map={
BTC:"bitcoin",
ETH:"ethereum",
SOL:"solana",
XRP:"ripple",
ZEC:"zcash"
};

const ticker=document.getElementById("ticker");

function pick(sym){
  ticker.value=sym;
  run();
}

ticker.addEventListener("input",()=>run());

function money(x){
  return "$"+Number(x).toFixed(2);
}

async function run(){
  const sym=ticker.value.toUpperCase();
  if(!map[sym]) return;

  const id=map[sym];

  const data=await fetch(
    `https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=usd&include_24hr_change=true`
  ).then(r=>r.json());

  const price=data[id].usd;
  const move=data[id].usd_24h_change || 0;

  let decision="HOLD";
  let trend="CHOP";
  let setup="WAIT";
  let reason="No clear edge";
  let strength=40;

  if(move>4){
    decision="BUY";
    trend="BULL";
    setup="BREAKOUT";
    reason="Strong momentum";
    strength=85;
  }
  else if(move>1){
    decision="BUY";
    trend="UP";
    setup="BUILD";
    reason="Momentum forming";
    strength=70;
  }
  else if(move<-4){
    decision="SELL";
    trend="BEAR";
    setup="BREAKDOWN";
    reason="Heavy selling";
    strength=85;
  }
  else if(move<-1){
    decision="SELL";
    trend="DOWN";
    setup="WEAK";
    reason="Weak structure";
    strength=70;
  }

  document.getElementById("price").textContent=money(price);
  document.getElementById("move").textContent=move.toFixed(2)+"%";
  document.getElementById("move").style.color=move>0?"#7cff55":"#ff4d5d";

  const sig=document.getElementById("signal");
  sig.textContent=decision;
  sig.className="badge "+(decision==="BUY"?"buy":decision==="SELL"?"sell":"hold");

  document.getElementById("trend").textContent=trend;
  document.getElementById("setup").textContent=setup;
  document.getElementById("reason").textContent=reason;

  document.getElementById("strength").style.width=strength+"%";

  const entry=price*.99;
  const stop=price*.96;
  const target=price*1.06;

  document.getElementById("entry").textContent=money(entry);
  document.getElementById("stop").textContent=money(stop);
  document.getElementById("target").textContent=money(target);
}
</script>

</body>
</html>
