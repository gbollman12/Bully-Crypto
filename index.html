<script>
const API_KEY = "92ef0c3056c641a5bd025c6a5a9363bb";

let selectedCoin = "";
let timer = null;
let priceHistory = [];
let marketData = {};
let marketHistory = {};

const SYMBOLS = {
  BTC: "BTC/USD",
  ETH: "ETH/USD",
  SOL: "SOL/USD",
  XRP: "XRP/USD"
};

function pick(sym,start,btn){
  selectedCoin = sym;
  document.querySelectorAll(".coinRail button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  loadRealData();
  if(timer) clearInterval(timer);
  timer = setInterval(loadRealData, 60000);
}

async function loadRealData(){
  const symbol = SYMBOLS[selectedCoin];

  const url =
    `https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(symbol)}&interval=1min&outputsize=30&apikey=${API_KEY}`;

  const res = await fetch(url);
  const data = await res.json();

  if(!data.values){
    document.getElementById("reason").innerText = data.message || "Data error.";
    return;
  }

  const candles = data.values.reverse();
  priceHistory = candles.map(c=>Number(c.close));

  const price = priceHistory.at(-1);
  const first = priceHistory[0];
  const trendMove = ((price-first)/first)*100;

  drawChart();
  updateTicker();

  let decision = "HOLD";
  if(trendMove > 0.2) decision = "BUY";
  else if(trendMove < -0.2) decision = "SELL";

  document.getElementById("signal").innerText = decision;
  document.getElementById("price").innerText = "$"+price.toFixed(price>100?2:4);
  document.getElementById("move").innerText = trendMove.toFixed(2)+"%";

  document.getElementById("trend").innerText =
    trendMove > 0 ? "BULL" : trendMove < 0 ? "BEAR" : "MIXED";

  document.getElementById("confidence").innerText =
    Math.min(100, Math.abs(trendMove*6)).toFixed(0)+"/100";

  document.getElementById("setup").innerText = decision;

  document.getElementById("reason").innerText =
    decision==="BUY" ? "Real market momentum building. Watch pullbacks." :
    decision==="SELL" ? "Real market weakness showing. Stay defensive." :
    "Real market is mixed. Wait for clarity.";

  updatePulse();
}

function drawChart(){
  const c=document.getElementById("chart");
  const ctx=c.getContext("2d");
  c.width=c.offsetWidth;
  c.height=90;

  let min=Math.min(...priceHistory);
  let max=Math.max(...priceHistory);

  ctx.clearRect(0,0,c.width,c.height);
  ctx.beginPath();

  priceHistory.forEach((p,i)=>{
    let x=i/(priceHistory.length-1)*c.width;
    let y=c.height-((p-min)/(max-min||1))*c.height;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });

  ctx.strokeStyle = priceHistory.at(-1) >= priceHistory[0] ? "#7cff55" : "#ff4d5d";
  ctx.lineWidth=2;
  ctx.stroke();
}

async function updateTicker(){
  let html = "";

  for(const coin of Object.keys(SYMBOLS)){
    const url =
      `https://api.twelvedata.com/quote?symbol=${encodeURIComponent(SYMBOLS[coin])}&apikey=${API_KEY}`;

    try{
      const res = await fetch(url);
      const q = await res.json();

      let change = Number(q.percent_change || 0);
      let cls = change > 0 ? "tUp" : change < 0 ? "tDown" : "tFlat";

      html += `<div class="${cls}">${coin} ${change.toFixed(2)}%</div>`;
    }catch(e){}
  }

  document.getElementById("ticker").innerHTML = html + html;
}

function updatePulse(){
  if(priceHistory.length < 2) return;

  let change = ((priceHistory.at(-1)-priceHistory[0])/priceHistory[0])*100;

  document.getElementById("bias").innerText =
    change > 0 ? "BULLISH" : change < 0 ? "BEARISH" : "MIXED";

  document.getElementById("vol").innerText =
    (Math.max(...priceHistory)-Math.min(...priceHistory)).toFixed(2);

  document.getElementById("pressure").innerText =
    change.toFixed(2)+"%";
}
</script>
