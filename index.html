<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bully Crypto</title>
<link rel="apple-touch-icon" href="logo.PNG">
<link rel="icon" href="logo.PNG">

<style>
body{margin:0;background:#050606;color:white;font-family:-apple-system,BlinkMacSystemFont,Arial}
.app{max-width:520px;margin:auto;padding-bottom:30px}
.header{display:flex;align-items:center;gap:14px;padding:18px;border-bottom:1px solid #1f1f1f}
.logo{width:54px;height:54px;border-radius:12px;object-fit:cover}
.title{font-size:24px;font-weight:900}
.sub{font-size:12px;color:#7cff55}

input{width:100%;padding:14px;border:none;border-bottom:1px solid #1f1f1f;background:#050606;color:white;font-size:16px;box-sizing:border-box}

.quick{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.quick button{flex:1 1 28%;padding:11px;border-radius:10px;border:1px solid #2a2a2a;background:#101010;color:white;font-weight:800}

.card{background:#101010;border:1px solid #242a25;border-radius:18px;padding:16px;margin:14px}
.price{font-size:44px;font-weight:950}
.badge{display:inline-block;padding:12px 18px;border-radius:999px;font-size:18px;font-weight:950;border:1px solid}
.buy{color:#7cff55;border-color:#7cff55}
.sell{color:#ff4d5d;border-color:#ff4d5d}
.hold{color:#ffd60a;border-color:#ffd60a}

.small{color:#aaa}
.row{display:flex;justify-content:space-between;margin-top:10px}
</style>
</head>

<body>
<div class="app">

<div class="header">
  <img src="logo.PNG" class="logo">
  <div>
    <div class="title">BULLY</div>
    <div class="sub">CRYPTO</div>
  </div>
</div>

<input id="ticker" placeholder="Search: BTC, ETH, SOL">

<div class="quick">
  <button onclick="pick('BTC')">BTC</button>
  <button onclick="pick('ETH')">ETH</button>
  <button onclick="pick('SOL')">SOL</button>
  <button onclick="pick('XRP')">XRP</button>
  <button onclick="pick('DOGE')">DOGE</button>
  <button onclick="pick('ADA')">ADA</button>
</div>

<div class="card">
  <div id="coin" class="small">SELECT COIN</div>
  <div id="price" class="price">—</div>
  <div id="move" class="small">Tap a coin</div>
  <br>
  <div id="signal" class="badge hold">WAIT</div>
</div>

<div class="card">
  <div class="row"><span>Trend</span><span id="trend">—</span></div>
  <div class="row"><span>Setup</span><span id="setup">—</span></div>
  <div class="row"><span>Confidence</span><span id="confidence">—</span></div>
</div>

<div class="card">
  <div id="reason" class="small">Waiting.</div>
</div>

</div>

<script>
const ASSETS={
  BTC:"bitcoin",
  ETH:"ethereum",
  SOL:"solana",
  XRP:"xrp",
  DOGE:"dogecoin",
  ADA:"cardano"
};

let liveTimer=null;
let cache={};

function money(n){
  return "$"+Number(n).toLocaleString(undefined,{maximumFractionDigits:Number(n)>100?2:4});
}

function setSignal(decision){
  const el=document.getElementById("signal");
  el.textContent=decision;
  el.className="badge "+(decision==="BUY"?"buy":decision==="SELL"?"sell":"hold");
}

function pick(sym){
  document.getElementById("ticker").value=sym;

  if(liveTimer) clearInterval(liveTimer);

  run(false);

  liveTimer=setInterval(()=>{
    run(true);
  },5000);
}

document.getElementById("ticker").addEventListener("input",()=>{
  clearTimeout(window.typingTimer);
  window.typingTimer=setTimeout(()=>{
    if(liveTimer) clearInterval(liveTimer);
    run(false);
    liveTimer=setInterval(()=>run(true),5000);
  },700);
});

async function fetchAsset(sym){
  const id=ASSETS[sym];
  const now=Date.now();

  if(cache[sym] && now-cache[sym].time<30000){
    return cache[sym].data;
  }

  const res=await fetch("https://api.coincap.io/v2/assets/"+id);

  if(!res.ok){
    throw new Error("Bad response");
  }

  const json=await res.json();
  cache[sym]={time:now,data:json.data};
  return json.data;
}

async function run(isLive=false){
  const sym=document.getElementById("ticker").value.toUpperCase().trim();

  if(!ASSETS[sym]) return;

  if(!isLive){
    document.getElementById("coin").textContent=sym;
    document.getElementById("price").textContent="Loading...";
    document.getElementById("move").textContent="";
    setSignal("WAIT");
    document.getElementById("reason").textContent="Checking market data...";
  }

  try{
    const data=await fetchAsset(sym);

    const price=Number(data.priceUsd);
    const move=Number(data.changePercent24Hr);

    let decision="HOLD";
    let trend="MIXED";
    let setup="WAIT";
    let confidence=45;
    let reason="No clean edge. Hold and wait.";

    if(move>=3){
      decision="BUY";
      trend="BULL";
      setup="MOMENTUM";
      confidence=78;
      reason="Strong 24h momentum. Watch for pullback before chasing.";
    }else if(move>=1){
      decision="HOLD";
      trend="UP";
      setup="BUILDING";
      confidence=60;
      reason="Strength building, but not clean enough for a full buy.";
    }else if(move<=-3){
      decision="SELL";
      trend="BEAR";
      setup="WEAK";
      confidence=78;
      reason="Heavy downside pressure. Avoid new longs.";
    }else if(move<=-1){
      decision="HOLD";
      trend="DOWN";
      setup="CAUTION";
      confidence=55;
      reason="Weakening, but not enough for a clean sell.";
    }

    document.getElementById("coin").textContent=sym;
    document.getElementById("price").textContent=money(price);

    const moveEl=document.getElementById("move");
    moveEl.textContent=move.toFixed(2)+"% over 24h";
    moveEl.style.color=move>0?"#7cff55":move<0?"#ff4d5d":"#aaa";

    setSignal(decision);

    document.getElementById("trend").textContent=trend;
    document.getElementById("setup").textContent=setup;
    document.getElementById("confidence").textContent=confidence+"/100";
    document.getElementById("reason").textContent=reason;

  }catch(e){
    document.getElementById("price").textContent="Error";
    document.getElementById("move").textContent="";
    setSignal("WAIT");
    document.getElementById("trend").textContent="—";
    document.getElementById("setup").textContent="—";
    document.getElementById("confidence").textContent="—";
    document.getElementById("reason").textContent="Connection issue. Try again.";
  }
}
</script>

</body>
</html>
