<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bully Crypto</title>
<link rel="apple-touch-icon" href="logo.PNG">
<link rel="icon" href="logo.PNG">

<style>
body{margin:0;background:#050606;color:white;font-family:-apple-system}
.app{max-width:520px;margin:auto}
.header{display:flex;align-items:center;gap:12px;padding:18px;border-bottom:1px solid #1f1f1f}
.logo{width:50px;height:50px;border-radius:10px}
.title{font-size:24px;font-weight:900}
.sub{color:#7cff55;font-size:12px}
.quick{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.quick button{flex:1 1 28%;padding:12px;border-radius:10px;background:#111;border:1px solid #2a2a2a;color:white;font-weight:800}
.card{background:#101010;border:1px solid #242a25;border-radius:18px;padding:18px;margin:14px}
.price{font-size:46px;font-weight:950}
.badge{padding:12px 18px;border-radius:999px;font-weight:900;border:1px solid}
.buy{color:#7cff55;border-color:#7cff55}
.sell{color:#ff4d5d;border-color:#ff4d5d}
.hold{color:#ffd60a;border-color:#ffd60a}
.row{display:flex;justify-content:space-between;margin-top:10px;color:#aaa}
.tabs{display:flex;gap:8px;padding:0 14px 8px}
.tab{flex:1;padding:12px;border-radius:12px;border:1px solid #2a2a2a;background:#101010;color:#888;font-weight:900}
.tab.active{color:#7cff55;border-color:#7cff55}
.field{width:100%;margin-top:10px;padding:12px;border-radius:10px;border:1px solid #2a2a2a;background:#080808;color:white}
.saveBtn{width:100%;margin-top:12px;padding:12px;border-radius:12px;border:1px solid #7cff55;background:#101010;color:#7cff55;font-weight:900}
</style>
</head>

<body>
<div class="app">

<div class="header">
<img src="logo.PNG" class="logo">
<div>
<div class="title">BULLY</div>
<div class="sub">CRYPTO</div>
</div>
</div>

<div class="quick">
<button onclick="pick('BTC',65000)">BTC</button>
<button onclick="pick('ETH',3000)">ETH</button>
<button onclick="pick('SOL',150)">SOL</button>
<button onclick="pick('XRP',0.60)">XRP</button>
<button onclick="pick('DOGE',0.15)">DOGE</button>
<button onclick="pick('ADA',0.50)">ADA</button>
</div>

<div class="tabs">
<button class="tab active" onclick="showTab('overview', this)">Overview</button>
<button class="tab" onclick="showTab('plan', this)">Plan</button>
<button class="tab" onclick="showTab('position', this)">Position</button>
</div>

<!-- OVERVIEW -->
<div id="overview" class="tabPage">
<div class="card">
<div id="coin">SELECT COIN</div>
<div id="price" class="price">—</div>
<div id="move">Tap a coin</div><br>
<div id="signal" class="badge hold">WAIT</div>
</div>

<div class="card">
<div class="row"><span>Trend</span><span id="trend">—</span></div>
<div class="row"><span>Setup</span><span id="setup">—</span></div>
<div class="row"><span>Confidence</span><span id="confidence">—</span></div>
</div>

<div class="card">
<div id="reason">Waiting.</div>
</div>
</div>

<!-- PLAN -->
<div id="plan" class="tabPage" style="display:none">
  <div class="card">
    <div class="row"><span>Coin</span><span id="planCoin">—</span></div>
    <div class="row"><span>Signal</span><span id="planSignal">—</span></div>
    <div class="row"><span>Entry Zone</span><span id="entry">—</span></div>
    <div class="row"><span>Stop Loss</span><span id="stop">—</span></div>
    <div class="row"><span>Target</span><span id="target">—</span></div>
    <div class="row"><span>Risk / Reward</span><span id="riskReward">—</span></div>
    <div class="row"><span>Trade Quality</span><span id="tradeQuality">—</span></div>
  </div>
</div>

<!-- POSITION -->
<div id="position" class="tabPage" style="display:none">
<div class="card">
<div>Amount owned</div>
<input id="ownedAmount" class="field" placeholder="0.25">
<div>Average buy price</div>
<input id="avgBuy" class="field" placeholder="62000">
<button class="saveBtn" onclick="savePosition()">SAVE</button>
</div>

<div class="card">
<div class="row"><span>Value</span><span id="currentValue">—</span></div>
<div class="row"><span>PnL</span><span id="profitLoss">—</span></div>
<div class="row"><span>Verdict</span><span id="positionVerdict">—</span></div>
</div>
</div>

</div>

<script>
let price=0;
let selectedCoin="";
let timer=null;
let lastDecision="WAIT";
let priceHistory=[];
let scoreHistory=[];
let drift=0;

function money(n){return "$"+Number(n).toFixed(Number(n)>100?2:4);}

function setSignal(d){
lastDecision=d;
document.getElementById("signal").textContent=d;
document.getElementById("signal").className="badge "+(d==="BUY"?"buy":d==="SELL"?"sell":"hold");
updatePosition();
}

function pick(sym,start){
selectedCoin=sym;
price=start;
priceHistory=[start];
scoreHistory=[];
drift=0;
lastDecision="HOLD";
document.getElementById("coin").textContent=sym;
if(timer) clearInterval(timer);
run();
timer=setInterval(run,8000);
}

function run(){

let noise=(Math.random()-0.5)*0.0003;
drift+=(Math.random()-0.5)*0.0001;
drift=Math.max(-0.0005,Math.min(0.0005,drift));
let move=noise+drift;
price+=price*move;

priceHistory.push(price);
if(priceHistory.length>12) priceHistory.shift();

let first=priceHistory[0];
let last=priceHistory[priceHistory.length-1];
let trendMove=((last-first)/first)*100;

let avg=priceHistory.reduce((a,b)=>a+b,0)/priceHistory.length;
let above=price>avg;

let score=50;
if(trendMove>0.3) score+=25;
else if(trendMove<-0.3) score-=25;
if(above) score+=8; else score-=8;

score=Math.max(0,Math.min(100,score));
scoreHistory.push(score);
if(scoreHistory.length>6) scoreHistory.shift();

let avgScore=scoreHistory.reduce((a,b)=>a+b,0)/scoreHistory.length;

let decision=lastDecision;
if(avgScore>72) decision="BUY";
else if(avgScore<28) decision="SELL";
else decision="HOLD";

setSignal(decision);

document.getElementById("price").textContent=money(price);
document.getElementById("move").textContent=trendMove.toFixed(2)+"% trend";

document.getElementById("trend").textContent=avgScore>65?"BULL":avgScore<35?"BEAR":"MIXED";
document.getElementById("setup").textContent=decision;
document.getElementById("confidence").textContent=Math.round(avgScore)+"/100";

document.getElementById("reason").textContent="Stable trend-based signal.";

let entryLow=price*0.995;
let entryHigh=price*1.005;
let entryMid=(entryLow+entryHigh)/2;
let stop=price*0.97;

let target=trendMove>0?price*1.04:price*1.02;

let risk=Math.abs(entryMid-stop);
let reward=Math.abs(target-entryMid);
let rr=reward/risk;

let quality = "NO EDGE";

if(decision === "BUY"){
  if(rr >= 2 && avgScore >= 75 && trendMove > 0.25){
    quality = "ELITE";
  } else if(rr >= 1.5 && avgScore >= 68){
    quality = "GOOD";
  } else {
    quality = "WEAK R/R";
  }
}

else if(decision === "SELL"){
  if(avgScore < 25 && trendMove < -0.25){
    quality = "EXIT NOW";
  } else {
    quality = "TRIM / AVOID";
  }
}

else {
  if(avgScore >= 60 && trendMove > 0){
    quality = "WATCH BUY";
  } else if(avgScore <= 40 && trendMove < 0){
    quality = "WATCH SELL";
  } else {
    quality = "WAIT";
  }
}
document.getElementById("planSignal").textContent = lastDecision;
document.getElementById("planCoin").textContent = selectedCoin || "—";
document.getElementById("entry").textContent=money(entryLow)+" - "+money(entryHigh);
document.getElementById("stop").textContent=money(stop);
document.getElementById("target").textContent=money(target);
document.getElementById("riskReward").textContent="1 : "+rr.toFixed(2);
document.getElementById("tradeQuality").textContent=quality;

updatePosition();
}

function savePosition(){
localStorage.setItem(selectedCoin+"_amt",document.getElementById("ownedAmount").value);
localStorage.setItem(selectedCoin+"_avg",document.getElementById("avgBuy").value);
}

function updatePosition(){
let amt=Number(document.getElementById("ownedAmount").value)||0;
let avg=Number(document.getElementById("avgBuy").value)||0;

if(!amt){document.getElementById("currentValue").textContent="—";return;}

let val=amt*price;
let pnl=val-(amt*avg);
let pct=(pnl/(amt*avg))*100;

document.getElementById("currentValue").textContent=money(val);
document.getElementById("profitLoss").textContent=money(pnl)+" ("+pct.toFixed(1)+"%)";

document.getElementById("positionVerdict").textContent=
lastDecision==="BUY"?"HOLD/ADD":
lastDecision==="SELL"?"TRIM/EXIT":
"HOLD";
}

function showTab(id,btn){
document.querySelectorAll(".tabPage").forEach(p=>p.style.display="none");
document.getElementById(id).style.display="block";
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
btn.classList.add("active");
}
</script>

</body>
</html>
